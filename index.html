<!DOCTYPE html>
<html>
<head>
<title>She Rock She Creates™ PromptForge AI</title>

<style>
body {
font-family: Arial, sans-serif;
background: #fff0f7;
margin: 0;
padding: 0;
}

.header {
background: #8b2c83;
color: white;
text-align: center;
padding: 30px;
}

.container {
max-width: 800px;
margin: auto;
padding: 25px;
}

.card {
background: white;
border-radius: 15px;
padding: 25px;
box-shadow: 0 5px 15px rgba(0,0,0,.1);
}

button {
background: #8b2c83;
color: white;
border: none;
padding: 12px 20px;
border-radius: 10px;
cursor: pointer;
}

button:hover {
opacity: .8;
}

textarea {
width: 100%;
height: 120px;
padding: 12px;
margin-top: 10px;
border-radius: 8px;
border: 1px solid #ccc;
}

#result {
white-space: pre-line;
background: #fafafa;
padding: 15px;
border-radius: 10px;
margin-top: 15px;
}

</style>

</head>

<body>

<div class="header">
<h1>She Rock She Creates™</h1>
<p>PromptForge AI Design Assistant</p>
</div>

<div class="container">

<div class="card">

<h2>Create Your Design Idea</h2>

<p>
Tell PromptForge what you want to create:
</p>

<textarea id="idea" placeholder="Example: Birthday shirt for a 10 year old girl, pink butterflies, glitter style..."></textarea>
<label>Product Type:</label>
<input id="product" placeholder="Example: Shirt, tumbler, party favor">
i
<label>Occasion:</label>
<input id="occasion" placeholder="Example: Birthday, business, holiday">

<label>Design Style:</label>
<input id="style" placeholder="Example: Cute, luxury, cartoon, realistic">

<label>Color Preferences:</label>
<input id="colors" placeholder="Example: Pink, purple, gold">
<br><br>

<button onclick="generatePrompt()">
Create My AI Prompt
</button>

<h3>Your Design Prompt:</h3>

<p id="result"></p>

</div>

</div>

<script>

function generatePrompt() {

let idea = document.getElementById("idea").value;
let product = document.getElementById("product").value;
let occasion = document.getElementById("occasion").value;
let style = document.getElementById("style").value;
let colors = document.getElementById("colors").value;
if (idea.trim() === "") {
document.getElementById("result").innerText =
"Please describe what you want to create first.";
return;
}

let prompt =
"SHE ROCK SHE CREATES™ PROMPTFORGE AI DESIGN BRIEF\n\n" +

"PRODUCT TYPE:\n" +
"Create a professional design suitable for shirts, party favors, small business products, and print applications.\n\n" +

"DESIGN REQUEST:\n" +
idea +
"\n\n" +

"PRODUCT TYPE:\n" +
product +
"\n\n" +

"OCCASION:\n" +
occasion +
"\n\n" +

"DESIGN STYLE:\n" +
style +
"\n\n" +

"COLOR PREFERENCES:\n" +
colors +
"\n\n" +

"DESIGN DIRECTION:\n" +
"- Create a visually appealing professional design\n" +
"- Use a strong focal point\n" +
"- Make the layout balanced and easy to understand\n" +
"- Choose colors that work well together\n" +
"- Match the style to the customer's idea\n\n" +

"PRINT PRODUCTION REQUIREMENTS:\n" +
"- High resolution quality\n" +
"- Clean edges and bold outlines\n" +
"- Easy to resize without losing quality\n" +
"- Avoid tiny details that may disappear when printed\n" +
"- Make the design suitable for heat transfer, vinyl, sublimation, and merchandise\n\n" +

"FINAL DESIGN GOAL:\n" +
"Create a professional, eye-catching design concept that looks great digitally and produces beautifully as a finished product.";

document.getElementById("result").innerText = prompt;

}

</script>

</body>
</html>
