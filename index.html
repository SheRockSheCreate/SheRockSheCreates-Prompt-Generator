<!DOCTYPE html>
<html>
<head>
<title>She Rock She Creates™ Design Studio</title>

<style>
body {
font-family: Arial, sans-serif;
background: #fff0f7;
margin: 0;
padding: 0;
}

.header {
background: #8b2c83;
color: white;
text-align: center;
padding: 30px;
}

.container {
max-width: 800px;
margin: auto;
padding: 25px;
}

.card {
background: white;
border-radius: 15px;
padding: 25px;
box-shadow: 0 5px 15px rgba(0,0,0,.1);
}

button {
background: #8b2c83;
color: white;
border: none;
padding: 12px 20px;
border-radius: 10px;
cursor: pointer;
}

button:hover {
opacity: .8;
}
label {
display: block;
font-weight: bold;
color: #5c2058;
margin-top: 18px;
margin-bottom: 6px;
}

select {
width: 100%;
padding: 12px;
border: 1px solid #d8b4d2;
border-radius: 8px;
background: white;
font-size: 16px;
color: #333;
}
textarea {
width: 100%;
height: 120px;
padding: 12px;
margin-top: 10px;
border-radius: 8px;
border: 1px solid #ccc;
}

#result {
white-space: pre-line;
background: #fafafa;
padding: 15px;
border-radius: 10px;
margin-top: 15px;
}

</style>

</head>

<body>

<div class="header">
<h1>She Rock She Creates™</h1>
<p>Design Studio</p>
</div>

<div class="container">

<div class="card">

<h2>Create Your Design Idea</h2>

<p>
Tell PromptForge what you want to create:
</p>

<textarea id="idea" placeholder="Example: Birthday shirt for a 10 year old girl, pink butterflies, glitter style..."></textarea>
<label>Product Type:</label>

<select id="product">
<option value="">Choose a product</option>
<option>T-Shirt</option>
<option>Hoodie</option>
<option>Sweatshirt</option>
<option>Tumbler</option>
<option>Mug</option>
<option>Party Favor</option>
<option>Invitation</option>
<option>Flyer</option>
<option>Business Card</option>
<option>Sticker</option>
<option>Banner</option>
<option>Logo</option>
<option>Custom</option>
</select>

<label>Occasion:</label>

<select id="occasion">
<option value="">Choose an occasion</option>
<option>Birthday</option>
<option>Baby Shower</option>
<option>Graduation</option>
<option>Wedding</option>
<option>Anniversary</option>
<option>Memorial</option>
<option>Family Reunion</option>
<option>Business</option>
<option>Holiday</option>
<option>Vacation</option>
<option>Sports</option>
<option>Church</option>
<option>Custom</option>
</select>

<label>Design Style:</label>

<select id="style">
<option value="">Choose a style</option>
<option>Cute</option>
<option>Luxury</option>
<option>Cartoon</option>
<option>Realistic</option>
<option>Watercolor</option>
<option>Vintage</option>
<option>Minimalist</option>
<option>Graffiti</option>
<option>Anime</option>
<option>3D</option>
<option>Custom</option>
</select>
<label>Color Palette:</label>

<select id="colors">
<option value="">Choose a color palette</option>
<option>Pink & Gold</option>
<option>Pink & Purple</option>
<option>Black & Gold</option>
<option>Black & White</option>
<option>Blue & Silver</option>
<option>Red & Black</option>
<option>Rose Gold</option>
<option>Rainbow</option>
<option>Pastel</option>
<option>Earth Tones</option>
<option>Neon</option>
<option>Custom</option>
</select>
<br><br>

<button onclick="generatePrompt()">
Create My AI Prompt
</button>
<br><br>

<h2>Generate Your Design Image</h2>

<p>
Upload a photo or use your finished prompt to create your design.
</p>

<input type="file" id="imageUpload" accept="image/*">

<br><br>

<button onclick="generateImage()">
Generate My Design Image
</button>

<div id="imageResult"></div>
<h3>Your Design Prompt:</h3>

<p id="result"></p>
<br>

<button onclick="copyPrompt()">
Copy My Prompt
</button>
</div>

</div>

<script>

function generatePrompt() {

let idea = document.getElementById("idea").value;
let product = document.getElementById("product").value;
let occasion = document.getElementById("occasion").value;
let style = document.getElementById("style").value;
let colors = document.getElementById("colors").value;
if (idea.trim() === "") {
document.getElementById("result").innerText =
"Please describe what you want to create first.";
return;
}

let prompt =
"SHE ROCK SHE CREATES™ DESIGN BRIEF\n\n" +

"PRODUCT TYPE:\n" +
"Create a professional design suitable for shirts, party favors, small business products, and print applications.\n\n" +

"DESIGN REQUEST:\n" +
idea +
"\n\n" +

"PRODUCT TYPE:\n" +
product +
"\n\n" +

"OCCASION:\n" +
occasion +
"\n\n" +

"DESIGN STYLE:\n" +
style +
"\n\n" +

"COLOR PREFERENCES:\n" +
colors +
"\n\n" +

"DESIGN DIRECTION:\n" +
"- Create a visually appealing professional design\n" +
"- Use a strong focal point\n" +
"- Make the layout balanced and easy to understand\n" +
"- Choose colors that work well together\n" +
"- Match the style to the customer's idea\n\n" +

"PRINT PRODUCTION REQUIREMENTS:\n" +
"- High resolution quality\n" +
"- Clean edges and bold outlines\n" +
"- Easy to resize without losing quality\n" +
"- Avoid tiny details that may disappear when printed\n" +
"- Make the design suitable for heat transfer, vinyl, sublimation, and merchandise\n\n" +

"FINAL DESIGN GOAL:\n" +
"Create a professional, eye-catching design concept that looks great digitally and produces beautifully as a finished product.";

document.getElementById("result").innerText = prompt;

}
function generateImage() {

let prompt = document.getElementById("result").innerText;

if (prompt === "") {
document.getElementById("imageResult").innerText =
"Create your design prompt first.";
return;
}

document.getElementById("imageResult").innerText =
"Your image generation feature is ready for connection. Your design prompt is being prepared.";

}
function copyPrompt() {

let promptText = document.getElementById("result").innerText;

navigator.clipboard.writeText(promptText);

alert("Your She Rock She Creates™ prompt has been copied!");

}
  
</script>

</body>
</html>
